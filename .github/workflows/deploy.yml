name: DevSecOps Pipeline 🚀

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest ./app

    - name: Scan Docker Image (Trivy) 🔐
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
        format: table
        exit-code: 0
        ignore-unfixed: true
        severity: CRITICAL,HIGH

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest

    - name: Deploy to EC2 🚀
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
          docker stop devsecops-app || true
          docker rm devsecops-app || true
          docker run -d -p 4000:4000 --name devsecops-app ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
